                options.body = state.body || '{}';
            }
            renderRequestResponse('请求发送中...', 'Pending', false);
            try {
                const response = await fetch(state.fullUrl, options);
                const contentType = response.headers.get('content-type') || '';
                const rawText = await response.text();
                let resultText = rawText;
                if (contentType.includes('application/json')) {
                    try {
                        resultText = JSON.stringify(JSON.parse(rawText || 'null'), null, 2);
                    } catch (error) {
                        resultText = rawText;
                    }
                }
                patchRequestTabById(requestTabId, { responseText: resultText, responseStatus: `${response.status} ${response.statusText}`, responseIsError: !response.ok });
                if (getActiveRequestTab(readRequestTabsState()).id === requestTabId) {
                    renderRequestResponse(resultText, `${response.status} ${response.statusText}`, !response.ok);
                }
                pushRequestMessage(
                    !response.ok
                        ? `请求失败 ${response.status} ${response.statusText}`
                        : `请求成功 ${response.status} ${response.statusText}`,
                    response.ok ? 'success' : 'error'
                );
            } catch (error) {
                const message = `请求失败: ${error instanceof Error ? error.message : String(error)}`;
                patchRequestTabById(requestTabId, { responseText: message, responseStatus: 'Network Error', responseIsError: true });
                if (getActiveRequestTab(readRequestTabsState()).id === requestTabId) {
                    renderRequestResponse(message, 'Network Error', true);
                }
                pushRequestMessage(message, 'error');
            } finally {
                if (sendBtn) {
                    setRequestButtonLoading(sendBtn, false, originalBtnText);
                }
            }
        }

        function clearRequest() {
            const state = readRequestTabsState();
            const active = getActiveRequestTab(state);
            state.tabs = state.tabs.map(tab => tab.id === active.id ? buildRequestState({ id: active.id, name: active.name }) : tab);
            writeRequestTabsState(state);
            loadRequestFormState();
        }

        function closeRequestTab(tabId) {
            const state = readRequestTabsState();
            if (state.tabs.length === 1) {
                writeRequestTabsState(createDefaultRequestTabsState());
                loadRequestFormState();
                return;
            }
            state.tabs = state.tabs.filter(tab => tab.id !== tabId);
            if (!state.tabs.some(tab => tab.id === state.activeTabId)) {
                state.activeTabId = state.tabs[0].id;
            }
            writeRequestTabsState(state);
            loadRequestFormState();
        }

        function getHeadingText(heading) {
            const clone = heading.cloneNode(true);
            clone.querySelectorAll('.invoke-request-btn-wrap').forEach(node => node.remove());
            return String(clone.textContent || '').trim();
        }

        function pickFirstString(source, keys) {
            if (!source || typeof source !== 'object') return '';
            for (const key of keys) {
                const value = source[key];
                if (value === undefined || value === null) continue;
                const text = String(value).trim();
                if (text) return text;
            }
            return '';
        }

        function normalizeMetadataParamRows(rawRows) {
            if (!Array.isArray(rawRows)) return [];
            return rawRows.map(row => {
                if (!row) return { key: '', value: '' };
                if (typeof row === 'string') return { key: row.trim(), value: '' };
                if (Array.isArray(row)) return { key: String(row[0] || '').trim(), value: '' };
                return {
                    key: String(row.key || row.name || row.paramName || row.field || '').trim(),
                    value: String(row.value || row.defaultValue || '').trim()
                };
            }).filter(row => row.key);
        }

        function normalizeApiSection(raw) {
            if (!raw || typeof raw !== 'object') return null;
            const method = normalizeRequestMethod(pickFirstString(raw, ['method', 'requestMethod', 'httpMethod']));
            const pathTemplate = normalizeRequestPath(
                pickFirstString(raw, ['pathTemplate', 'interfacePath', 'path', 'url']),
                ''
            );
            return {
                sectionHeadingId: pickFirstString(raw, ['sectionHeadingId', 'headingId', 'requestHeadingId']),
                sectionHeadingText: pickFirstString(raw, ['sectionHeadingText', 'headingText', 'requestHeadingText']),
                interfaceHeadingId: pickFirstString(raw, ['interfaceHeadingId', 'apiHeadingId', 'parentHeadingId']),
                interfaceTitle: pickFirstString(raw, ['interfaceTitle', 'apiTitle', 'interfaceName', 'name', 'title']),
                method,
                pathTemplate,
                pathParams: normalizeMetadataParamRows(raw.pathParams || raw.requestPathParams || raw.pathParameters),
                queryParams: normalizeMetadataParamRows(raw.queryParams || raw.requestParams || raw.parameters || raw.params),
                body: pickFirstString(raw, ['requestBodyJson', 'bodyJson', 'requestBodyExample', 'bodyExample', 'requestBody', 'body'])
            };
        }

        function normalizeApiSections(rawSections) {
            if (!Array.isArray(rawSections)) return [];
            return rawSections
                .map(section => normalizeApiSection(section))
                .filter(section => section && (section.pathTemplate || section.sectionHeadingId || section.sectionHeadingText));
        }

        function parseTableRows(table) {
            const rows = Array.from(table?.querySelectorAll('tr') || []);
            if (rows.length <= 1) return [];
            return rows.slice(1).map(row => Array.from(row.querySelectorAll('th,td')).map(cell => String(cell.textContent || '').trim())).filter(row => row.some(Boolean));
        }

        function findSectionNodes(startHeading) {
            if (!startHeading) return [];
            const nodes = [];
            let next = startHeading.nextElementSibling;
            while (next && !/^H[1-4]$/i.test(next.tagName)) {
                nodes.push(next);
                next = next.nextElementSibling;
            }
            return nodes;
        }

        function findSectionHeading(blockStart, label) {
            let node = blockStart;
            while (node) {
                if (node.tagName === 'H4' && getHeadingText(node) === label) return node;
                node = node.nextElementSibling;
                if (node && node.tagName === 'H3') break;
            }
            return null;
        }

        function collectInterfaceBlock(sectionHeading) {
            let h3 = sectionHeading;
            while (h3 && h3.tagName !== 'H3') h3 = h3.previousElementSibling;
            return h3 || sectionHeading;
        }

        function getStructuredMetadata(sectionHeading) {
            if (!currentApiSections.length) return null;
            const headingId = String(sectionHeading?.id || '').trim();
            const headingText = getHeadingText(sectionHeading);
            const interfaceHeading = collectInterfaceBlock(sectionHeading);
            const interfaceHeadingId = String(interfaceHeading?.id || '').trim();
            const interfaceTitle = getHeadingText(interfaceHeading);

            let match = null;
            if (headingId) {
                match = currentApiSections.find(section => section.sectionHeadingId === headingId) || null;
            }
            if (!match) {
                match = currentApiSections.find(section =>
                    section.sectionHeadingText === headingText &&
                    section.interfaceHeadingId &&
                    section.interfaceHeadingId === interfaceHeadingId
                ) || null;
            }
            if (!match) {
                match = currentApiSections.find(section =>
                    section.sectionHeadingText === headingText &&
                    section.interfaceTitle &&
                    section.interfaceTitle === interfaceTitle
                ) || null;
            }
            if (!match) {
                match = currentApiSections.find(section => section.sectionHeadingText === headingText) || null;
            }
            if (!match) return null;

            return {
                name: match.interfaceTitle || interfaceTitle || headingText,
                method: match.method,
                pathTemplate: match.pathTemplate,
                pathParams: mergePathParams(match.pathTemplate, match.pathParams || []),
                queryParams: normalizeParamRows(match.queryParams || [], true),
                body: String(match.body || '')
            };
        }

        function parseInterfaceMetadata(sectionHeading) {
            const structured = getStructuredMetadata(sectionHeading);
            if (structured && structured.pathTemplate && structured.method) {
                return structured;
            }
            const blockStart = collectInterfaceBlock(sectionHeading);
            const blockNodes = [];
            let node = blockStart;
            while (node) {
                if (node !== blockStart && node.tagName === 'H3') break;
                blockNodes.push(node);
                node = node.nextElementSibling;
            }

            let pathTemplate = '';
            let method = '';
            blockNodes.forEach(item => {
                const text = String(item.textContent || '').trim();
                if (!pathTemplate && text.includes('接口路径')) {
                    const code = item.querySelector('code');
                    pathTemplate = normalizeRequestPath(code ? code.textContent.trim() : text.split(':').pop().trim(), '');
                }
                if (!method && text.includes('请求方式')) {
                    const match = text.match(/\b(GET|POST)\b/i);
                    if (match) method = match[1].toUpperCase();
                }
            });

            const pathHeading = findSectionHeading(blockStart, '路径参数');
            const paramsHeading = findSectionHeading(blockStart, '请求参数');
            const bodyHeading = findSectionHeading(blockStart, '请求体');
            const pathTable = findSectionNodes(pathHeading).find(node => node.tagName === 'TABLE');
            const paramsTable = findSectionNodes(paramsHeading).find(node => node.tagName === 'TABLE');
            const bodyNodes = findSectionNodes(bodyHeading);
            const bodyTable = bodyNodes.find(node => node.tagName === 'TABLE');
            const bodyCode = bodyNodes.map(node => node.querySelector('pre code')).find(Boolean);

            const pathParamRows = parseTableRows(pathTable).map(row => ({ key: row[0] || '', value: '' }));
            const queryParamRows = parseTableRows(paramsTable).map(row => ({ key: row[0] || '', value: '' }));
            let body = '';
            if (bodyCode) {
                body = bodyCode.textContent.trim();
            } else if (bodyTable) {
                const payload = {};
                parseTableRows(bodyTable).forEach(row => {
                    if (!row[0]) return;
                    const type = String(row[1] || '').toLowerCase();
                    payload[row[0]] = type.includes('number') ? 0 : type.includes('bool') ? false : type.includes('string') ? '' : null;
                });
                body = Object.keys(payload).length ? JSON.stringify(payload, null, 2) : '';
            }

            return {
                name: getHeadingText(blockStart),
                method,
                pathTemplate,
                pathParams: mergePathParams(pathTemplate, pathParamRows),
                queryParams: queryParamRows,
                body
            };
        }

        function initRequestParams() {
            document.querySelectorAll('.invoke-request-btn-wrap').forEach(node => node.remove());
            document.querySelectorAll('.markdown-body h4').forEach(heading => {
                const label = getHeadingText(heading);
                if (label !== '请求参数' && label !== '请求体') return;
                const wrap = document.createElement('span');
                wrap.className = 'invoke-request-btn-wrap';
                wrap.style.marginLeft = '10px';
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'invoke-params-btn';
                button.textContent = '调用';
                button.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    const metadata = parseInterfaceMetadata(heading);
                    if (!metadata.pathTemplate || !metadata.method) {
                        window.alert(!metadata.pathTemplate ? '未识别接口路径，请检查当前接口文档格式' : '未识别请求方式，请检查当前接口文档格式');
                        return;
                    }
                    const nextName = metadata.name || metadata.pathTemplate.split('/').filter(Boolean).pop() || '请求';
                    patchActiveRequestTab({
                        name: nextName,
                        method: metadata.method,
                        pathTemplate: metadata.pathTemplate,
                        pathParams: metadata.pathParams,
                        queryParams: metadata.queryParams,
                        body: metadata.body || '',
                        responseText: REQUEST_EMPTY_RESPONSE_TEXT,
                        responseStatus: '',
                        responseIsError: false
                    });
                    const panel = document.getElementById('request-panel');
                    if (panel && !panel.classList.contains('expanded')) {
                        panel.classList.add('expanded');
                        localStorage.setItem(REQUEST_PANEL_STATE_KEY, 'expanded');
                    }
                    loadRequestFormState();
                });
                wrap.appendChild(button);
                heading.appendChild(wrap);
            });
        }

        function getTocCollapseStorageKey() {
            return `${TOC_COLLAPSE_STORAGE_PREFIX}${currentFilePath || '__global__'}`;
        }

        function readTocCollapseState() {
            try {
                const raw = localStorage.getItem(getTocCollapseStorageKey());
                const parsed = raw ? JSON.parse(raw) : {};
                return parsed && typeof parsed === 'object' ? parsed : {};
            } catch (error) {
                return {};
            }
        }

        function writeTocCollapseState(state) {
            localStorage.setItem(getTocCollapseStorageKey(), JSON.stringify(state || {}));
        }

        function getTocLevel(item) {
            const match = String(item?.className || '').match(/toc-level-(\d+)/);
            return match ? Number(match[1]) : 1;
        }

        function getDefaultTocCollapsed(item) {
            return item.dataset.hasChildren === 'true' && getTocLevel(item) >= 3;
        }

        function resolveTocCollapseState(tocItems, savedState) {
            const resolved = {};
            tocItems.forEach(item => {
                const id = String(item.getAttribute('data-id') || '').trim();
                if (!id || item.dataset.hasChildren !== 'true') return;
                if (Object.prototype.hasOwnProperty.call(savedState, id)) {
                    resolved[id] = Boolean(savedState[id]);
                } else {
                    resolved[id] = getDefaultTocCollapsed(item);
                }
            });
            return resolved;
        }

        function applyTocCollapseState(tocItems, resolvedState) {
            const collapsedLevels = [];
            tocItems.forEach(item => {
                const level = getTocLevel(item);
                while (collapsedLevels.length && level <= collapsedLevels[collapsedLevels.length - 1]) {
                    collapsedLevels.pop();
                }
                const hidden = collapsedLevels.length > 0;
                item.classList.toggle('toc-collapsed-hidden', hidden);
                const id = String(item.getAttribute('data-id') || '').trim();
                const hasChildren = item.dataset.hasChildren === 'true';
                const collapsed = hasChildren && Boolean(resolvedState[id]);
                item.classList.toggle('toc-collapsed', collapsed);
                const toggleBtn = item.querySelector('.toc-toggle-btn');
                if (toggleBtn) {
                    toggleBtn.classList.toggle('is-leaf', !hasChildren);
                    toggleBtn.setAttribute('aria-expanded', hasChildren ? String(!collapsed) : 'true');
                    toggleBtn.setAttribute('aria-disabled', hasChildren ? 'false' : 'true');
                }
                if (collapsed) collapsedLevels.push(level);
            });
        }

        function expandTocAncestorsForItem(targetItem) {
            if (!targetItem) return;
            const tocList = document.querySelector('.toc-list');
            if (!tocList) return;
            const tocItems = Array.from(tocList.querySelectorAll('.toc-item'));
            const targetIndex = tocItems.indexOf(targetItem);
            if (targetIndex < 0) return;
            const targetLevel = getTocLevel(targetItem);
            if (targetLevel <= 1) return;

            const savedState = readTocCollapseState();
            let changed = false;
            let needLevel = targetLevel - 1;
            for (let i = targetIndex - 1; i >= 0 && needLevel >= 1; i--) {
                const item = tocItems[i];
                const level = getTocLevel(item);
                if (level !== needLevel) continue;
                if (item.dataset.hasChildren === 'true') {
                    const id = String(item.getAttribute('data-id') || '').trim();
                    if (id && savedState[id]) {
                        delete savedState[id];
                        changed = true;
                    }
                }
                needLevel -= 1;
            }
            if (!changed) return;
            writeTocCollapseState(savedState);
            const resolvedState = resolveTocCollapseState(tocItems, savedState);
            applyTocCollapseState(tocItems, resolvedState);
        }

        function revealTocItemFeedback(item, options = {}) {
            if (!item) return;
            const flash = options.flash !== false;
            item.scrollIntoView({ block: 'nearest', behavior: 'auto' });
            if (!flash) return;
            const itemId = String(item.getAttribute('data-id') || '');
            const now = Date.now();
            if (options.force !== true && window.lastTocFeedbackId === itemId && (now - (window.lastTocFeedbackAt || 0)) < 420) {
                return;
            }
            window.lastTocFeedbackId = itemId;
            window.lastTocFeedbackAt = now;
            document.querySelectorAll('.toc-item.toc-locate-flash').forEach(el => el.classList.remove('toc-locate-flash'));
            item.classList.remove('toc-locate-flash');
            void item.offsetWidth;
            item.classList.add('toc-locate-flash');
            window.setTimeout(() => item.classList.remove('toc-locate-flash'), 900);
        }

        function resolveScrollSpyActiveTocItem(headings, currentHeadingIndex) {
            const current = headings[currentHeadingIndex];
            if (!current || !current.item) return null;
            const currentLevel = getTocLevel(current.item);
            if (currentLevel === 3) return current.item;
            if (currentLevel >= 4) {
                for (let i = currentHeadingIndex - 1; i >= 0; i--) {
                    const candidate = headings[i]?.item;
                    if (candidate && getTocLevel(candidate) === 3) {
                        return candidate;
                    }
                }
            }
            return current.item;
        }

        function toggleOnlyLevel4UnderCurrentLevel3(clickedLevel3Item, tocItems) {
            if (!clickedLevel3Item || getTocLevel(clickedLevel3Item) !== 3) return;
            const clickedId = String(clickedLevel3Item.getAttribute('data-id') || '').trim();
            if (!clickedId) return;
            const nextSaved = readTocCollapseState();
            let changed = false;
            tocItems.forEach(item => {
                if (getTocLevel(item) !== 3 || item.dataset.hasChildren !== 'true') return;
                const id = String(item.getAttribute('data-id') || '').trim();
                if (!id) return;
                if (id === clickedId) {
                    if (nextSaved[id] !== false) {
                        nextSaved[id] = false;
                        changed = true;
                    }
                } else {
                    const nextCollapsed = true;
                    const isDefault = getDefaultTocCollapsed(item) === nextCollapsed;
                    if (isDefault) {
                        if (Object.prototype.hasOwnProperty.call(nextSaved, id)) {
                            delete nextSaved[id];
                            changed = true;
                        }
                    } else if (nextSaved[id] !== nextCollapsed) {
                        nextSaved[id] = nextCollapsed;
                        changed = true;
                    }
                }
            });
            if (!changed) return;
            writeTocCollapseState(nextSaved);
            const resolvedState = resolveTocCollapseState(tocItems, nextSaved);
            applyTocCollapseState(tocItems, resolvedState);
        }

        function initToc() {
            const tocList = document.querySelector('.toc-list');
            if (!tocList) return;
            const tocItems = Array.from(tocList.querySelectorAll('.toc-item'));
            if (!tocItems.length) return;

            const levels = tocItems.map(item => getTocLevel(item));
            tocItems.forEach((item, index) => {
                const hasChildren = index < tocItems.length - 1 && levels[index + 1] > levels[index];
                item.dataset.hasChildren = hasChildren ? 'true' : 'false';
                let label = item.querySelector('.toc-label');
                if (!label) {
                    const text = String(item.textContent || '').trim();
                    item.textContent = '';
                    const toggleBtn = document.createElement('button');
                    toggleBtn.type = 'button';
                    toggleBtn.className = 'toc-toggle-btn';
                    toggleBtn.setAttribute('aria-label', '切换目录展开状态');
                    label = document.createElement('span');
                    label.className = 'toc-label';
                    label.textContent = text;
                    item.appendChild(toggleBtn);
                    item.appendChild(label);
                } else if (!item.querySelector('.toc-toggle-btn')) {
                    const toggleBtn = document.createElement('button');
                    toggleBtn.type = 'button';
                    toggleBtn.className = 'toc-toggle-btn';
                    toggleBtn.setAttribute('aria-label', '切换目录展开状态');
                    item.prepend(toggleBtn);
                }
                if (label) {
                    label.dataset.tooltip = String(label.textContent || '').trim();
                }
            });

            const savedState = readTocCollapseState();
            const resolvedState = resolveTocCollapseState(tocItems, savedState);
            applyTocCollapseState(tocItems, resolvedState);

            if (tocList.dataset.bound !== 'true') {
                tocList.dataset.bound = 'true';
                tocList.addEventListener('click', (event) => {
                    const toggleBtn = event.target.closest('.toc-toggle-btn');
                    const tocItem = event.target.closest('.toc-item');
                    if (!tocItem) return;
                    if (toggleBtn) {
                        event.preventDefault();
                        event.stopPropagation();
                        if (tocItem.dataset.hasChildren !== 'true') return;
                        const id = String(tocItem.getAttribute('data-id') || '').trim();
                        if (!id) return;
                        const nextSaved = readTocCollapseState();
                        const currentlyCollapsed = tocItem.classList.contains('toc-collapsed');
                        const nextCollapsed = !currentlyCollapsed;
                        const isDefault = getDefaultTocCollapsed(tocItem) === nextCollapsed;
                        if (isDefault) delete nextSaved[id];
                        else nextSaved[id] = nextCollapsed;
                        writeTocCollapseState(nextSaved);
                        const nextResolved = resolveTocCollapseState(Array.from(tocList.querySelectorAll('.toc-item')), nextSaved);
                        applyTocCollapseState(Array.from(tocList.querySelectorAll('.toc-item')), nextResolved);
                        return;
                    }
                    const label = event.target.closest('.toc-label');
                    if (!label) return;
                    event.preventDefault();
                    if (getTocLevel(tocItem) === 3) {
                        toggleOnlyLevel4UnderCurrentLevel3(tocItem, Array.from(tocList.querySelectorAll('.toc-item')));
                    }
                    const href = String(tocItem.getAttribute('href') || '');
                    if (!href.startsWith('#')) return;
                    const targetId = href.substring(1);
                    scrollToHeading(targetId);
                    document.querySelectorAll('.toc-item.active').forEach(el => el.classList.remove('active'));
                    tocItem.classList.add('active');
                });
            }
        }

        function initTocScrollSpy() {
            const contentArea = document.querySelector('.markdown-body');
            if (!contentArea) return;
            const tocItems = document.querySelectorAll('.toc-item');
            const headings = [];
            tocItems.forEach(item => {
                const id = item.getAttribute('data-id');
                const heading = document.getElementById(id);
                if (heading) headings.push({ element: heading, item: item });
            });
            if (headings.length === 0) return;
            let lastActiveId = '';
            function updateActiveHeading() {
                const contentRect = contentArea.getBoundingClientRect();
                const threshold = 60;
                let currentHeadingIndex = -1;
                for (let i = 0; i < headings.length; i++) {
                    const headingRect = headings[i].element.getBoundingClientRect();
                    const relativeTop = headingRect.top - contentRect.top;
                    if (relativeTop <= threshold) currentHeadingIndex = i;
                    else break;
                }
                const breadcrumbEl = document.getElementById('breadcrumb-path');
                if (currentHeadingIndex === -1) {
                    document.querySelectorAll('.toc-item.active').forEach(el => el.classList.remove('active'));
                    document.querySelectorAll('.toc-item.toc-active-l3').forEach(el => el.classList.remove('toc-active-l3'));
                    lastActiveId = '';
                    renderBreadcrumb();
                    updateHeadingHash('');
                    return;
                }
                const currentHeading = headings[currentHeadingIndex];
                if (currentHeading && currentHeading.item) {
                    const activeTocItem = resolveScrollSpyActiveTocItem(headings, currentHeadingIndex) || currentHeading.item;
                    expandTocAncestorsForItem(activeTocItem);
                    const currentId = String(activeTocItem.getAttribute('data-id') || '');
                    const changedActive = currentId !== lastActiveId;
                    if (changedActive) {
                        document.querySelectorAll('.toc-item.active').forEach(el => el.classList.remove('active'));
                        document.querySelectorAll('.toc-item.toc-active-l3').forEach(el => el.classList.remove('toc-active-l3'));
                    }
                    activeTocItem.classList.add('active');
                    if (getTocLevel(activeTocItem) === 3) {
                        activeTocItem.classList.add('toc-active-l3');
                    }
                    if (currentId && changedActive) {
                        revealTocItemFeedback(activeTocItem, { flash: true });
                    }
                    lastActiveId = currentId;
                    const targetLevels = [1, 2, 3];
                    const levelData = { 1: null, 2: null, 3: null };
                    for (let i = currentHeadingIndex; i >= 0; i--) {
                        const h = headings[i];
                        const levelMatch = h.item.className.match(/toc-level-(\d+)/);
                        if (!levelMatch) continue;
                        const level = parseInt(levelMatch[1]);
                        if (targetLevels.includes(level) && !levelData[level]) {
                            const labelText = String(h.item.querySelector('.toc-label')?.textContent || h.item.textContent || '').trim();
                            levelData[level] = { text: labelText, id: h.element.id };
                        }
                    }
                    renderBreadcrumb(levelData);
                    updateHeadingHash(currentHeading.element.id);
                }
            }
            contentArea.addEventListener('scroll', () => {
                clearTimeout(window.tocScrollTimeout);
                window.tocScrollTimeout = setTimeout(updateActiveHeading, 100);
            });
            updateActiveHeading();
        }

        window.scrollToHeading = function(id) {
            const target = document.getElementById(id);
            const contentArea = document.querySelector('.markdown-body');
            const tocItem = document.querySelector(`.toc-item[data-id="${escapeSelectorValue(id)}"]`);
            if (tocItem) {
                expandTocAncestorsForItem(tocItem);
                revealTocItemFeedback(tocItem, { flash: true, force: true });
            }
            if (target && contentArea) {
                expandCollapsedAncestorsForHeading(target);
                const mainRect = document.querySelector('main').getBoundingClientRect();
                const targetRect = target.getBoundingClientRect();
                const tabsHeight = document.querySelector('.tabs-bar').offsetHeight || 0;
                const toolbarHeight = document.querySelector('.toolbar').offsetHeight || 0;
                const offset = tabsHeight + toolbarHeight + 20;
                const deltaY = targetRect.top - mainRect.top - offset;
                contentArea.scrollTop = contentArea.scrollTop + deltaY;
                setTimeout(() => {
                    target.classList.add('heading-flash');
                    setTimeout(() => target.classList.remove('heading-flash'), 600);
                }, 100);
            }
        };

        function getTabs() {
            try {
                const tabs = JSON.parse(localStorage.getItem(TABS_KEY) || '[]');
                return Array.isArray(tabs) ? tabs : [];
            } catch (error) {
                return [];
            }
        }

        function saveTabs(tabs) {
            localStorage.setItem(TABS_KEY, JSON.stringify(Array.from(new Set((tabs || []).filter(Boolean)))));
        }

        function getTabHistory() {
            try {
                const history = JSON.parse(localStorage.getItem(TAB_HISTORY_KEY) || '[]');
                return Array.isArray(history) ? history : [];
            } catch (error) {
                return [];
            }
        }

        function saveTabHistory(history) {
            localStorage.setItem(TAB_HISTORY_KEY, JSON.stringify(Array.from(new Set((history || []).filter(Boolean)))));
        }

        function touchTabHistory(path) {
            const target = String(path || '').trim();
            if (!target) return;
            const history = getTabHistory().filter(item => item !== target);
            history.push(target);
            saveTabHistory(history);
        }

        function syncTabHistoryWithTabs(tabs) {
            const validTabs = Array.from(new Set((tabs || []).filter(Boolean)));
            const validSet = new Set(validTabs);
            const history = getTabHistory().filter(item => validSet.has(item));
            validTabs.forEach(item => {
                if (!history.includes(item)) history.push(item);
            });
            saveTabHistory(history);
            return history;
        }

        function enforceTabLimit(preferredPath = currentFilePath) {
            let tabs = getTabs();
            let history = syncTabHistoryWithTabs(tabs);
            while (tabs.length > MAX_OPEN_TABS) {
                const candidate = history.find(path => path !== preferredPath && tabs.includes(path));
                const victim = candidate || history.find(path => tabs.includes(path));
                if (!victim) break;
                tabs = tabs.filter(path => path !== victim);
                history = history.filter(path => path !== victim);
            }
            saveTabs(tabs);
            saveTabHistory(history);
            return tabs;
        }

        function registerTab(path) {
            const target = String(path || '').trim();
            if (!target) return;
            const tabs = getTabs();
            if (!tabs.includes(target)) {
                tabs.push(target);
                saveTabs(tabs);
            }
            touchTabHistory(target);
            enforceTabLimit(target);
        }

        function closeOtherTabs(path) {
            const keepPath = String(path || currentFilePath || '').trim();
            if (!keepPath) return;
            saveTabs([keepPath]);
            saveTabHistory([keepPath]);
            if (keepPath === currentFilePath) {
                renderTabs();
                return;
            }
            window.location.href = '/md-view?path=' + encodeURIComponent(keepPath);
        }
        
        function initTabs() {
            if (currentFilePath) {
                registerTab(currentFilePath);
            }
            renderTabs();
        }

        let targetTabPath = null;
        function renderTabs() {
            const tabs = getTabs();
            const container = document.querySelector('.tabs-bar');
            if (!container) return;
            container.innerHTML = '';
            tabs.forEach(path => {
                const name = path.split(/[\\/]/).pop();
                const div = document.createElement('div');
                div.className = 'tab' + (path === currentFilePath ? ' active' : '');
                div.onclick = async () => {
                    touchTabHistory(path);
                    if (path !== currentFilePath) {
                        await openFile(path);
                    } else {
                        renderTabs();
                    }
                };
                div.addEventListener('contextmenu', (e) => {
                    e.preventDefault(); targetTabPath = path;
                    const contextMenu = document.getElementById('tab-context-menu');
                    contextMenu.style.display = 'block'; contextMenu.style.left = e.pageX + 'px'; contextMenu.style.top = e.pageY + 'px';
                });
                const span = document.createElement('div');
                span.className = 'tab-title'; span.textContent = name; span.title = path;
                div.appendChild(span);
                const close = document.createElement('div');
                close.className = 'tab-close'; close.textContent = '×';
                close.onclick = (e) => { e.stopPropagation(); closeTab(path); };
                div.appendChild(close);
                container.appendChild(div);
            });
        }

        function closeTab(path) {
            let tabs = getTabs();
            const index = tabs.indexOf(path);
            if (index > -1) {
                tabs.splice(index, 1);
                saveTabs(tabs);
                saveTabHistory(getTabHistory().filter(item => item !== path));
                if (path === currentFilePath) {
                    if (tabs.length > 0) window.location.href = '/md-view?path=' + encodeURIComponent(tabs[Math.min(index, tabs.length - 1)]);
                    else window.location.href = '/md-list';
                } else renderTabs();
            }
        }

        function escapeSelectorValue(value) {
            const source = String(value || '');
            if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(source);
            return source.replace(/["\\]/g, '\\$&');
        }

        function normalizeTreePath(path) {
            return String(path || '').replace(/\\/g, '/').toLowerCase();
        }

        function findTreeFileLinkByPath(path) {
            const rawPath = String(path || '').trim();
            if (!rawPath) return null;
            const bySelector = document.querySelector(`.tree-file[data-path="${escapeSelectorValue(rawPath)}"]`);
            if (bySelector) return bySelector;
            const target = normalizeTreePath(rawPath);
            const allLinks = document.querySelectorAll('.tree-file[data-path]');
            for (const link of allLinks) {
                if (normalizeTreePath(link.getAttribute('data-path')) === target) return link;
            }
            return null;
        }

        function revealTreeFile(fileLink, options = {}) {
            if (!fileLink) return false;
            const flash = options.flash !== false;
            const shouldScroll = options.scroll === true;
            const nextExpandedPaths = new Set(JSON.parse(localStorage.getItem('md-preview-expanded-paths') || '[]'));
            let parent = fileLink.parentElement;
            while (parent) {
                if (parent.classList && parent.classList.contains('tree-children')) {
                    parent.style.display = '';
                    parent.classList.add('expanded');
                    const path = parent.getAttribute('data-path');
                    if (path) nextExpandedPaths.add(path);
                    const folder = parent.previousElementSibling;
                    if (folder && folder.classList && folder.classList.contains('tree-folder')) {
                        folder.style.display = '';
                        const toggle = folder.querySelector('.tree-toggle');
                        if (toggle) toggle.classList.add('expanded');
                    }
                }
                parent = parent.parentElement;
            }
            localStorage.setItem('md-preview-expanded-paths', JSON.stringify(Array.from(nextExpandedPaths)));
            fileLink.classList.add('active');
            if (shouldScroll) {
                fileLink.scrollIntoView({ block: 'center', behavior: 'auto' });
            }
            if (!flash) return true;
            const row = fileLink.closest('.tree-file-row');
            document.querySelectorAll('.tree-file.locate-flash').forEach(el => el.classList.remove('locate-flash'));
            document.querySelectorAll('.tree-file-row.locate-flash').forEach(el => el.classList.remove('locate-flash'));
            fileLink.classList.remove('locate-flash');
            if (row) row.classList.remove('locate-flash');
            void fileLink.offsetWidth;
            fileLink.classList.add('locate-flash');
            if (row) row.classList.add('locate-flash');
            window.setTimeout(() => {
                fileLink.classList.remove('locate-flash');
                if (row) row.classList.remove('locate-flash');
            }, 1200);
            return true;
        }

        async function copyTextToClipboard(text) {
            const value = String(text || '');
            const fallbackCopy = () => {
                const helper = document.createElement('textarea');
                helper.value = value;
                helper.setAttribute('readonly', 'readonly');
                helper.style.position = 'fixed';
                helper.style.opacity = '0';
                helper.style.pointerEvents = 'none';
                document.body.appendChild(helper);
                helper.focus();
                helper.select();
                const copied = document.execCommand('copy');
                helper.remove();
                if (!copied) {
                    throw new Error('浏览器不支持复制');
                }
            };
            if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                try {
                    await navigator.clipboard.writeText(value);
                    return;
                } catch (error) {
                    fallbackCopy();
                    return;
                }
            }
            fallbackCopy();
        }

        function initTreeInteraction() {
            const expandedPaths = JSON.parse(localStorage.getItem('md-preview-expanded-paths') || '[]');
            expandedPaths.forEach(path => {
                const folder = document.querySelector(`.tree-folder[data-path="${escapeSelectorValue(path)}"]`);
                const children = document.querySelector(`.tree-children[data-path="${escapeSelectorValue(path)}"]`);
                if (folder && children) {
                    children.classList.add('expanded');
                    const toggle = folder.querySelector('.tree-toggle');
                    if (toggle) toggle.classList.add('expanded');
                }
            });

            document.querySelectorAll('.tree-folder').forEach(folder => {
                folder.addEventListener('click', function(e) {
                    e.preventDefault();
                    const toggle = this.querySelector('.tree-toggle');
                    const children = this.nextElementSibling;
                    const path = this.getAttribute('data-path');
                    if (children && children.classList.contains('tree-children')) {
                        const isExpanded = children.classList.toggle('expanded');
                        toggle.classList.toggle('expanded');
                        const currentPaths = JSON.parse(localStorage.getItem('md-preview-expanded-paths') || '[]');
                        if (isExpanded) { if (!currentPaths.includes(path)) currentPaths.push(path); }
                        else { const idx = currentPaths.indexOf(path); if (idx > -1) currentPaths.splice(idx, 1); }
                        localStorage.setItem('md-preview-expanded-paths', JSON.stringify(currentPaths));
                    }
                });
            });

            document.querySelectorAll('.tree-file').forEach(fileLink => {
                fileLink.addEventListener('click', async (e) => {
                    const path = fileLink.getAttribute('data-path');
                    if (!path) return;
                    e.preventDefault();
                    await openFile(path);
                });
            });

            document.querySelectorAll('.tree-copy-name').forEach(copyBtn => {
                copyBtn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const fileName = String(copyBtn.getAttribute('data-name') || '').trim();
                    try {
                        await copyTextToClipboard(fileName);
                        pushRequestMessage('已复制文件名', 'success');
                    } catch (error) {
                        pushRequestMessage(`复制失败: ${error instanceof Error ? error.message : String(error)}`, 'error');
                    }
                });
            });

            document.querySelectorAll('.tree-copy-url').forEach(copyBtn => {
                copyBtn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const filePath = String(copyBtn.getAttribute('data-path') || '').trim();
                    const url = `${window.location.origin}/md-view?path=${encodeURIComponent(filePath)}`;
                    try {
                        await copyTextToClipboard(url);
                        pushRequestMessage('已复制链接', 'success');
                    } catch (error) {
                        pushRequestMessage(`复制失败: ${error instanceof Error ? error.message : String(error)}`, 'error');
                    }
                });
            });

            const locateBtn = document.getElementById('locate-btn');
            if (locateBtn && locateBtn.dataset.bound !== 'true') {
                locateBtn.dataset.bound = 'true';
                locateBtn.addEventListener('click', () => {
                    const searchInput = document.getElementById('search-input');
                    if (searchInput && searchInput.value) { searchInput.value = ''; searchInput.dispatchEvent(new Event('input')); }
                    const currentActive = findTreeFileLinkByPath(currentFilePath) || document.querySelector('.tree-file.active');
                    revealTreeFile(currentActive, { flash: true, scroll: true });
                });
            }

            const fileList = document.querySelector('.file-list');
            if (fileList && fileList.dataset.copyBound !== 'true') {
                fileList.dataset.copyBound = 'true';
                fileList.addEventListener('click', async (event) => {
                    const copyNameBtn = event.target.closest('.tree-copy-name');
                    const copyUrlBtn = event.target.closest('.tree-copy-url');
                    const trigger = copyNameBtn || copyUrlBtn;
                    if (!trigger) return;
                    event.preventDefault();
                    event.stopPropagation();
                    const rawPath = String(trigger.getAttribute('data-path') || '').trim();
                    const fileName = String(trigger.getAttribute('data-name') || '').trim() || rawPath.split(/[\\/]/).pop() || '文件';
                    if (!rawPath) {
                        pushRequestMessage('复制失败：未找到文件路径', 'error');
                        return;
                    }
                    try {
                        const text = copyNameBtn
                            ? fileName
                            : `${window.location.origin}/md-view?path=${encodeURIComponent(rawPath)}`;
                        await copyTextToClipboard(text);
                        pushRequestMessage(copyNameBtn ? `已复制文件名：${fileName}` : `已复制链接：${fileName}`, 'success');
                    } catch (error) {
                        pushRequestMessage(`复制失败：${error instanceof Error ? error.message : String(error)}`, 'error');
                    }
                });
            }
            revealTreeFile(findTreeFileLinkByPath(currentFilePath), { flash: false, scroll: false });

            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                if (!searchInput.dataset.originalBound) {
                    searchInput.dataset.originalBound = 'true';
                }
                let emptyState = document.getElementById('file-search-empty');
                if (!emptyState && fileList) {
                    emptyState = document.createElement('div');
                    emptyState.id = 'file-search-empty';
                    emptyState.className = 'file-search-empty';
                    emptyState.textContent = '未找到匹配的 Markdown 文件';
                    fileList.insertAdjacentElement('afterend', emptyState);
                }
                document.querySelectorAll('.tree-file-name').forEach(nameEl => {
                    if (!nameEl.dataset.originalText) {
                        nameEl.dataset.originalText = nameEl.textContent || '';
                    }
                });
                searchInput.addEventListener('input', (e) => {
                    const term = String(e.target.value || '').trim();
                    const lowerTerm = term.toLowerCase();
                    const allRows = document.querySelectorAll('.tree-file-row');
                    const allFiles = document.querySelectorAll('.tree-file');
                    const allFolders = document.querySelectorAll('.tree-folder');
                    const allChildren = document.querySelectorAll('.tree-children');
                    allFiles.forEach(fileLink => {
                        const nameEl = fileLink.querySelector('.tree-file-name');
                        if (!nameEl) return;
                        const originalText = nameEl.dataset.originalText || nameEl.textContent || '';
                        nameEl.innerHTML = highlightSearchText(originalText, term);
                    });
                    if (!lowerTerm) {
                        allRows.forEach(el => el.style.removeProperty('display'));
                        allFiles.forEach(el => el.style.removeProperty('display'));
                        allFolders.forEach(el => el.style.removeProperty('display'));
                        allChildren.forEach(el => {
                            el.style.removeProperty('display');
                            const path = el.getAttribute('data-path');
                            const expandedPaths = JSON.parse(localStorage.getItem('md-preview-expanded-paths') || '[]');
                            const shouldExpand = path && expandedPaths.includes(path);
                            el.classList.toggle('expanded', Boolean(shouldExpand));
                            const folder = el.previousElementSibling;
                            const toggle = folder?.querySelector('.tree-toggle');
                            if (toggle) toggle.classList.toggle('expanded', Boolean(shouldExpand));
                        });
                        if (emptyState) emptyState.classList.remove('visible');
                        return;
                    }
                    allRows.forEach(el => el.style.display = 'none');
                    allFolders.forEach(el => el.style.display = 'none');
                    allChildren.forEach(el => el.style.display = 'none');
                    let matchCount = 0;
                    allRows.forEach(row => {
                        const file = row.querySelector('.tree-file');
                        if (!file) return;
                        const fileName = String(file.getAttribute('data-name') || file.textContent || '').toLowerCase();
                        const filePath = String(file.getAttribute('data-path') || '').toLowerCase();
                        if (fileName.includes(lowerTerm) || filePath.includes(lowerTerm)) {
                            matchCount++;
                            row.style.display = 'flex';
                            file.style.removeProperty('display');
                            let parent = row.parentElement;
                            while(parent && !parent.closest('.file-list')) {
                                if (parent.classList.contains('tree-children')) {
                                    parent.classList.add('expanded');
                                    parent.style.display = 'block';
                                    if (parent.previousElementSibling) {
                                        parent.previousElementSibling.style.removeProperty('display');
                                        const t = parent.previousElementSibling.querySelector('.tree-toggle');
                                        if (t) t.classList.add('expanded');
                                    }
                                }
                                parent = parent.parentElement;
                            }
                        }
                    });
                    if (emptyState) {
                        emptyState.classList.toggle('visible', matchCount === 0);
                    }
                });
            }
        }

        async function toggleView(mode) {
            const previewBtn = document.getElementById('btn-preview');
            const rawBtn = document.getElementById('btn-raw');
            const markdownBody = document.getElementById('markdown-body');
            const rawBody = document.getElementById('raw-body');
            if (mode === 'preview') {
                if (rawBtn.classList.contains('active')) {
                    lastRawScrollSnapshot = captureRawScrollSnapshot();
                }
                previewBtn.classList.add('active'); rawBtn.classList.remove('active');
                markdownBody.style.display = 'block'; rawBody.style.display = 'none';
                syncPreviewScrollFromRaw(lastRawScrollSnapshot);
            } else {
                lastPreviewScrollSnapshot = capturePreviewScrollSnapshot();
                previewBtn.classList.remove('active'); rawBtn.classList.add('active');
                markdownBody.style.display = 'none'; rawBody.style.display = 'block';
                await loadRawContent();
                syncRawScrollFromPreview(lastPreviewScrollSnapshot);
            }
        }

        function downloadFile() { if (currentFilePath) window.location.href = `/md-download?path=${encodeURIComponent(currentFilePath)}`; }

        const closeCurrentMenuItem = document.getElementById('menu-close-current');
        if (closeCurrentMenuItem && closeCurrentMenuItem.dataset.bound !== 'true') {
            closeCurrentMenuItem.dataset.bound = 'true';
            closeCurrentMenuItem.addEventListener('click', () => {
                closeTab(targetTabPath || currentFilePath);
            });
        }

        const closeOthersMenuItem = document.getElementById('menu-close-others');
        if (closeOthersMenuItem && closeOthersMenuItem.dataset.bound !== 'true') {
            closeOthersMenuItem.dataset.bound = 'true';
            closeOthersMenuItem.addEventListener('click', () => {
                closeOtherTabs(targetTabPath || currentFilePath);
            });
        }

        const closeAllMenuItem = document.getElementById('menu-close-all');
        if (closeAllMenuItem && closeAllMenuItem.dataset.bound !== 'true') {
            closeAllMenuItem.dataset.bound = 'true';
            closeAllMenuItem.addEventListener('click', () => {
                saveTabs([]);
                saveTabHistory([]);
                window.location.href = '/md-list';
            });
        }

        document.addEventListener('click', () => {
            const contextMenu = document.getElementById('tab-context-menu');
            if (contextMenu) contextMenu.style.display = 'none';
        });
        document.addEventListener('keydown', async (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'w') {
                e.preventDefault();
                closeTab(currentFilePath);
                return;
            }
            if (!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;
            if (!/^[1-9]$/.test(e.key)) return;
            const index = Number(e.key) - 1;
            const tabs = getTabs();
            const targetPath = tabs[index];
            if (!targetPath) return;
            e.preventDefault();
            touchTabHistory(targetPath);
            if (targetPath !== currentFilePath) {
                await openFile(targetPath);
            } else {
                renderTabs();
            }
        });

        window.addEventListener('popstate', async () => {
            const params = new URLSearchParams(window.location.search);
            const path = params.get('path');
            if (!path || path === currentFilePath) return;
            currentFilePath = path;
            await loadPreviewData();
        });

        loadPreviewData();
    </script>
</body>
