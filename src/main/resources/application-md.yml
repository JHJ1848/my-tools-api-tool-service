# ============================================
# Markdown预览模块配置
# ============================================
# 使用说明: 在运行目录下创建 config/application-md.yml
# 并填入实际的配置信息

markdown:
  preview:
    # MD文件根目录 (可配置多个目录，用逗号分隔)
    root-paths: ${MD_ROOT_PATHS:./docs,./md-files}
    # 是否启用本地图片预览
    enable-image-preview: ${MD_ENABLE_IMAGE_PREVIEW:true}
    # 允许的文件扩展名
    allowed-extensions: ${MD_ALLOWED_EXTENSIONS:.md,.markdown,.txt}
    # 最大文件大小 (MB)
    max-file-size: ${MD_MAX_FILE_SIZE:10}
