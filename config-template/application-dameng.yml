# ============================================
# 达梦数据库模块配置
# ============================================
# 使用说明: 在运行目录下创建 config/application-dameng.yml
# 并填入实际的数据库连接信息

spring:
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          username: ${DAMENG_USERNAME:}
          password: ${DAMENG_PASSWORD:}
          driver-class-name: dm.jdbc.driver.DmDriver
          url: jdbc:dm://${DAMENG_HOST:127.0.0.1}:${DAMENG_PORT:5236}/${DAMENG_DATABASE:}?useUnicode=true&characterEncoding=utf-8
        sso:
          username: ${DAMENG_USERNAME:}
          password: ${DAMENG_PASSWORD:}
          driver-class-name: dm.jdbc.driver.DmDriver
          url: jdbc:dm://${DAMENG_HOST:127.0.0.1}:${DAMENG_PORT:5236}/${DAMENG_DATABASE:}?useUnicode=true&characterEncoding=utf-8
        FARMLAND_ENGINEER_QUALITY_INSPECT:
          username: ${DAMENG_USERNAME:}
          password: ${DAMENG_PASSWORD:}
          driver-class-name: dm.jdbc.driver.DmDriver
          url: jdbc:dm://${DAMENG_HOST:127.0.0.1}:${DAMENG_PORT:5236}/${DAMENG_DATABASE_FARMLAND:}?useUnicode=true&characterEncoding=utf-8
