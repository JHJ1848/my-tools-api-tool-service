name: Release

# 推送 v* 标签时自动构建全部 Windows 发行产物并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Windows packages
        run: npm run dist:all

      - name: Publish verified packages
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $version = $package.version
          $name = $package.build.productName
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cne "v$version") { throw "Tag $tag does not match package version $version" }
          $installer = "$name-Setup-$version-x64.exe"
          $assets = @(
            "release/$installer"
            "release/$name-$version-x64.msi"
            "release/$name-$version-x64-portable.exe"
            "release/$name-$version-x64.zip"
            "release/$installer.blockmap"
            'release/latest.yml'
          )
          foreach ($asset in $assets) {
            if ((Get-Item -LiteralPath $asset -ErrorAction Stop).Length -le 0) {
              throw "Empty release asset: $asset"
            }
          }
          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($ref.type -eq 'tag') {
            $notes = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($ref.sha)" --jq .message | Out-String
          } else {
            $notes = git log -1 --format=%B | Out-String
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ([string]::IsNullOrWhiteSpace($notes)) { throw "Missing release notes for $tag" }
          $notesPath = Join-Path $env:RUNNER_TEMP "$tag-notes.md"
          [System.IO.File]::WriteAllText($notesPath, $notes)
          $flags = @('--verify-tag', '--notes-file', $notesPath, '--title', "$name $tag")
          if ($version.Contains('-')) { $flags += '--prerelease' }
          gh release create $tag @flags @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
